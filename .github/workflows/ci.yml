name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  static-and-unit:
    name: Static Check & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  browser-e2e:
    name: Playwright Browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium

      - name: Start app for E2E
        env:
          NODE_ENV: development
          PORT: 3000
          SESSION_SECRET: ci-session-secret-012345678901234567890123456789
          SMS_PROVIDER: fake
        run: |
          npm run e2e:server > /tmp/attendance-app.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3100/api/v1/health && break || sleep 1; done

      - name: Run Playwright E2E
        env:
          BASE_URL: http://127.0.0.1:3100
        run: npm run test:e2e

      - name: Upload E2E report & logs on failure
        if: failure()
        uses: actions/upload-artifact@b4b15b3412b64973599d37353b7bc4edbe9d6910 # v4.4.3
        with:
          name: playwright-artifacts
          path: |
            output/playwright/
            playwright-report/
            test-results/
            /tmp/attendance-app.log
          if-no-files-found: warn

  postgres-integration:
    name: Restricted PostgreSQL RLS & Redis Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: attendance_migration
          POSTGRES_PASSWORD: migration-ci-password
          POSTGRES_DB: school_attendance
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U attendance_migration -d school_attendance"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Create database roles
        env:
          PGPASSWORD: migration-ci-password
        run: |
          psql -h 127.0.0.1 -U attendance_migration -d school_attendance <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'attendance_app') THEN
              CREATE ROLE attendance_app LOGIN PASSWORD 'application-ci-password';
            END IF;
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'attendance_system') THEN
              CREATE ROLE attendance_system LOGIN PASSWORD 'system-ci-password';
            END IF;
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'attendance_system_rls') THEN
              CREATE ROLE attendance_system_rls NOLOGIN;
            END IF;
          END $$;
          ALTER ROLE attendance_app NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          ALTER ROLE attendance_system NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          GRANT attendance_system_rls TO attendance_system;
          REVOKE attendance_system_rls FROM attendance_app;
          GRANT CONNECT ON DATABASE school_attendance TO attendance_app;
          GRANT CONNECT ON DATABASE school_attendance TO attendance_system;
          GRANT USAGE ON SCHEMA public TO attendance_app;
          GRANT USAGE ON SCHEMA public TO attendance_system;
          ALTER DEFAULT PRIVILEGES FOR ROLE attendance_migration IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO attendance_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE attendance_migration IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO attendance_system;
          ALTER DEFAULT PRIVILEGES FOR ROLE attendance_migration IN SCHEMA public GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO attendance_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE attendance_migration IN SCHEMA public GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO attendance_system;
          SQL

      - name: Run Drizzle migrations
        env:
          NODE_ENV: production
          DATABASE_URL: postgres://attendance_migration:migration-ci-password@127.0.0.1:5432/school_attendance
          SESSION_SECRET: ci-session-secret-012345678901234567890123456789
          REDIS_URL: redis://127.0.0.1:6379
          REDIS_KEY_HMAC_SECRET: ci-redis-hmac-secret-012345678901234567890123456789
          METRICS_AUTH_TOKEN: ci-metrics-token-012345678901234567890123456789
        run: npm run migrate

      - name: Run PostgreSQL RLS tests
        env:
          NODE_ENV: production
          PG_RLS_MIGRATION_DATABASE_URL: postgres://attendance_migration:migration-ci-password@127.0.0.1:5432/school_attendance
          PG_RLS_APPLICATION_DATABASE_URL: postgres://attendance_app:application-ci-password@127.0.0.1:5432/school_attendance
          PG_RLS_SYSTEM_DATABASE_URL: postgres://attendance_system:system-ci-password@127.0.0.1:5432/school_attendance
          SESSION_SECRET: ci-session-secret-012345678901234567890123456789
          REDIS_URL: redis://127.0.0.1:6379
          REDIS_KEY_HMAC_SECRET: ci-redis-hmac-secret-012345678901234567890123456789
          METRICS_AUTH_TOKEN: ci-metrics-token-012345678901234567890123456789
          SMS_PROVIDER: fake
          ALLOW_FAKE_SMS_IN_PRODUCTION: 'true'
        run: npm run test:postgres

  backup-restore-test:
    name: Encrypted Backup & Restore Verification Drill
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: backup_test_user
          POSTGRES_PASSWORD: backup_test_password
          POSTGRES_DB: school_attendance_source
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U backup_test_user -d school_attendance_source"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create Target Database & Run Drill
        env:
          PGPASSWORD: backup_test_password
          DATABASE_URL: postgres://backup_test_user:backup_test_password@127.0.0.1:5433/school_attendance_source
          TARGET_DATABASE_URL: postgres://backup_test_user:backup_test_password@127.0.0.1:5433/school_attendance_target
          BACKUP_PASSPHRASE: ci-backup-passphrase-01234567890123456789
        run: |
          psql -h 127.0.0.1 -p 5433 -U backup_test_user -d school_attendance_source -c "CREATE DATABASE school_attendance_target;"
          npm run migrate
          npm run seed
          chmod +x scripts/backupAndRestore.sh
          ./scripts/backupAndRestore.sh

  k8s-validation:
    name: Kubernetes Schema & Security Manifest Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Kubeconform
        run: |
          wget -q https://github.com/yannh/kubeconform/releases/download/v0.6.4/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform-linux-amd64.tar.gz
          sudo mv kubeconform /usr/local/bin/
      - name: Validate Kubernetes Manifest Schemas
        run: |
          kubeconform -summary -strict -skip ServiceMonitor -kubernetes-version 1.28.0 k8s/
          if [ -f k8s/secret.yaml ]; then
            echo "ERROR: k8s/secret.yaml must not be committed to git!"
            exit 1
          fi

  docker-smoke:
    name: Production Docker Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Copy .env.example to .env
        run: cp .env.example .env
      - name: Build & Start Compose
        run: docker compose up -d --build
      - name: Verify Service Health
        run: |
          HEALTHY=false
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/v1/health; then
              echo "App health verified!"
              HEALTHY=true
              break
            fi
            sleep 2
          done
          if [ "$HEALTHY" != "true" ]; then
            echo "ERROR: Docker container failed to become healthy after 60 seconds."
            docker compose ps
            docker compose logs
            exit 1
          fi
      - name: Teardown Compose
        if: always()
        run: docker compose down -v

  security:
    name: Security & Vulnerability Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

      - name: Generate CycloneDX SBOM
        run: npx @cyclonedx/cyclonedx-npm --output-format JSON --output-file output/sbom.cdx.json || true

      - name: Upload Security SBOM Artifact
        uses: actions/upload-artifact@b4b15b3412b64973599d37353b7bc4edbe9d6910 # v4.4.3
        with:
          name: sbom-artifact
          path: output/sbom.cdx.json
          if-no-files-found: ignore
