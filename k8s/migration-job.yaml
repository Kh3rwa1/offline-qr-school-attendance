apiVersion: batch/v1
kind: Job
metadata:
  name: school-attendance-migration-job
spec:
  template:
    spec:
      serviceAccountName: school-attendance-web-sa
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: migrate
          image: offline-qr-school-attendance@sha256:7f8e3d4c5b6a7890123456789abcdef0123456789abcdef0123456789abcdef0
          command: ["node", "dist/migrate.cjs"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
          envFrom:
            - secretRef:
                name: school-attendance-secrets
            - configMapRef:
                name: school-attendance-config
      volumes:
        - name: tmp-volume
          emptyDir: {}
  backoffLimit: 2
