apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: school-attendance-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - attendance.school.gov
      secretName: school-attendance-tls
  rules:
    - host: attendance.school.gov
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: school-attendance-web-service
                port:
                  number: 80
