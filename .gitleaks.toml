# Gitleaks Configuration for Offline QR + RFID School Attendance Repository
title = "Gitleaks Config"

[allowlist]
description = "Global allowlist for confirmed non-secret CI test credentials and synthetic test environment variables"
regexes = [
  '''ci[_-]session[_-]secret.*''',
  '''ci[_-]metrics[_-]auth[_-]token.*''',
  '''ci[_-]rfid[_-]hmac[_-]secret.*''',
  '''kind[_-]ci[_-].*''',
  '''load[_-]test[_-]secret.*''',
  '''test[_-]secret[_-]32[_-]chars.*''',
  '''SchoolAdminPassword123!''',
  '''TeacherPassword123!''',
  '''SuperSecretAdminPassword123!'''
]
paths = [
  '''\.github/workflows/.*''',
  '''tests/.*''',
  '''scripts/.*''',
  '''docker-compose\.yml'''
]
