# Example Kubernetes Secret Template
# DO NOT COMMIT REAL PRODUCTION CREDENTIALS OR SECRETS TO GIT.
# Inject real production secrets using SealedSecrets, External Secrets Operator, or Vault.
apiVersion: v1
kind: Secret
metadata:
  name: school-attendance-secrets
type: Opaque
stringData:
  DATABASE_URL: "postgresql://<APP_DB_USER>:<APP_DB_PASSWORD>@<DB_HOST>:5432/<DB_NAME>?sslmode=require"
  SYSTEM_DATABASE_URL: "postgresql://<SYSTEM_DB_USER>:<SYSTEM_DB_PASSWORD>@<DB_HOST>:5432/<DB_NAME>?sslmode=require"
  REDIS_URL: "redis://:<REDIS_PASSWORD>@<REDIS_HOST>:6379/0"
  REDIS_KEY_HMAC_SECRET: "<GENERATE_MINIMUM_32_BYTE_RANDOM_HMAC_SECRET>"
  SESSION_SECRET: "<GENERATE_MINIMUM_32_BYTE_RANDOM_SESSION_SECRET>"
  METRICS_AUTH_TOKEN: "<GENERATE_MINIMUM_32_BYTE_RANDOM_METRICS_TOKEN>"
