<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#144e39" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1512" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Offline-first school attendance platform — works without internet using mobile camera QR or UHF RFID. UDISE+-oriented internal reports, parent SMS queue, English, বাংলা & हिंदी." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AttendEase" />
    <meta property="og:title" content="AttendEase OS — Offline-First School Attendance Platform" />
    <meta property="og:description" content="Offline-first school attendance platform — works without internet using mobile camera QR or UHF RFID. UDISE+-oriented internal reports, parent SMS queue, English, বাংলা & हिंदी." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="AttendEase OS — Offline-First School Attendance Platform" />
    <meta name="twitter:description" content="Works without active internet using mobile camera QR or UHF RFID. UDISE+-oriented internal reports, parent SMS queue, English, বাংলা & हिंदी." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AttendEase" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Webfonts load asynchronously via an external loader so first paint never blocks
         on the font CDN over weak rural connections. External file keeps CSP happy
         (production script-src is 'self'; inline handlers would be blocked). -->
    <script type="module" src="/font-loader.js"></script>
    <noscript><link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet" /></noscript>
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('attendease-theme');
          var supportDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (theme === 'dark' || (!theme && supportDarkMode)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <title>AttendEase OS — Offline-First School Attendance Platform</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
