name: Full-Scale Load & Performance Certification

on:
  workflow_dispatch:
    inputs:
      schools:
        description: 'Target School Count (default: 100)'
        required: true
        default: '100'
      students_per_school:
        description: 'Students Per School (default: 5000 for 500k total)'
        required: true
        default: '5000'
      duration_seconds:
        description: 'Benchmark Duration in Seconds (default: 900 for 15 minutes)'
        required: true
        default: '900'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  full-scale-benchmark:
    name: 100-School 500k-Student Business Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: attendance_migration
          POSTGRES_PASSWORD: migration-ci-password
          POSTGRES_DB: school_attendance
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U attendance_migration -d school_attendance"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Run Database Migrations
        env:
          NODE_ENV: production
          DATABASE_URL: postgres://attendance_migration:migration-ci-password@127.0.0.1:5432/school_attendance
          SYSTEM_DATABASE_URL: postgres://attendance_migration:migration-ci-password@127.0.0.1:5432/school_attendance
          AUTH_DATABASE_URL: postgres://attendance_migration:migration-ci-password@127.0.0.1:5432/school_attendance
          SESSION_SECRET: ci-session-secret-012345678901234567890123456789
          CSRF_SECRET: ci-session-secret-012345678901234567890123456789
          BACKUP_ENCRYPTION_KEY: ci-backup-encryption-key-32bytes-long
          REDIS_URL: redis://127.0.0.1:6379
          REDIS_KEY_HMAC_SECRET: ci-redis-hmac-secret-012345678901234567890123456789
          RFID_HMAC_SECRET: ci_rfid_hmac_secret_key_32bytes_long
          METRICS_AUTH_TOKEN: ci-metrics-auth-token-012345678901234567890123456789
          SMS_PROVIDER: console
          ALLOW_FAKE_SMS_IN_PRODUCTION: "true"
          ALLOW_IN_MEMORY_RATE_LIMITER: "true"
        run: npm run migrate

      - name: Generate 500,000 Student Scale Dataset
        env:
          NODE_ENV: production
          DATABASE_URL: postgres://attendance_migration:migration-ci-password@127.0.0.1:5432/school_attendance
          SYSTEM_DATABASE_URL: postgres://attendance_migration:migration-ci-password@127.0.0.1:5432/school_attendance
          AUTH_DATABASE_URL: postgres://attendance_migration:migration-ci-password@127.0.0.1:5432/school_attendance
          SESSION_SECRET: ci-session-secret-012345678901234567890123456789
          CSRF_SECRET: ci-session-secret-012345678901234567890123456789
          BACKUP_ENCRYPTION_KEY: ci-backup-encryption-key-32bytes-long
          REDIS_KEY_HMAC_SECRET: ci-redis-hmac-secret-012345678901234567890123456789
          RFID_HMAC_SECRET: ci_rfid_hmac_secret_key_32bytes_long
          METRICS_AUTH_TOKEN: ci-metrics-auth-token-012345678901234567890123456789
          SMS_PROVIDER: console
          ALLOW_FAKE_SMS_IN_PRODUCTION: "true"
          ALLOW_IN_MEMORY_RATE_LIMITER: "true"
          SCALE_SCHOOLS: ${{ inputs.schools }}
          SCALE_STUDENTS_PER_SCHOOL: ${{ inputs.students_per_school }}
        run: npx tsx scripts/generateScaleDataset.ts

      - name: Execute 15-Minute 500 RPS Business Load Benchmark
        env:
          NODE_ENV: production
          DATABASE_URL: postgres://attendance_migration:migration-ci-password@127.0.0.1:5432/school_attendance
          SYSTEM_DATABASE_URL: postgres://attendance_migration:migration-ci-password@127.0.0.1:5432/school_attendance
          AUTH_DATABASE_URL: postgres://attendance_migration:migration-ci-password@127.0.0.1:5432/school_attendance
          SESSION_SECRET: ci-session-secret-012345678901234567890123456789
          CSRF_SECRET: ci-session-secret-012345678901234567890123456789
          BACKUP_ENCRYPTION_KEY: ci-backup-encryption-key-32bytes-long
          METRICS_AUTH_TOKEN: ci-metrics-auth-token-012345678901234567890123456789
          REDIS_KEY_HMAC_SECRET: ci-redis-hmac-secret-012345678901234567890123456789
          RFID_HMAC_SECRET: ci_rfid_hmac_secret_key_32bytes_long
          REDIS_URL: redis://127.0.0.1:6379
          FULL_500K_BENCHMARK: '1'
          LOAD_TEST_DURATION_SEC: ${{ inputs.duration_seconds }}
          LOAD_P95_THRESHOLD_MS: '300'
          LOAD_AUTH_P95_THRESHOLD_MS: '600'
          SMS_PROVIDER: console
          ALLOW_FAKE_SMS_IN_PRODUCTION: "true"
          ALLOW_IN_MEMORY_RATE_LIMITER: "true"
          GITHUB_SHA: ${{ github.sha }}
        run: npm run test:load-full

      - name: Verify Report Commit SHA Matches Workflow Head SHA
        run: |
          REPORT_SHA=$(jq -r '.gitCommitSha' output/full-scale-report.json)
          EXPECTED_SHA="${{ github.sha }}"
          echo "Report SHA:   ${REPORT_SHA}"
          echo "Expected SHA: ${EXPECTED_SHA}"
          if [ "${REPORT_SHA}" != "${EXPECTED_SHA}" ]; then
            echo "ERROR: Report commit SHA (${REPORT_SHA}) does not match workflow head SHA (${EXPECTED_SHA})"
            exit 1
          fi

      - name: Upload Full-Scale Benchmark Reports & Checksums
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: full-scale-benchmark-reports
          path: |
            output/scale-dataset-report.json
            output/full-scale-report.json
            output/full-scale-report.md
            output/post-load-integrity-report.json
            output/load-certification-checksums.sha256
          if-no-files-found: ignore
