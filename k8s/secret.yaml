apiVersion: v1
kind: Secret
metadata:
  name: school-attendance-secrets
type: Opaque
stringData:
  DATABASE_URL: "postgresql://attendance_app:SecretPass123@postgres-service:5432/school_attendance?sslmode=require"
  SYSTEM_DATABASE_URL: "postgresql://attendance_system_rls:SecretPass123@postgres-service:5432/school_attendance?sslmode=require"
  REDIS_URL: "redis://:RedisPass123@redis-service:6379/0"
  REDIS_KEY_HMAC_SECRET: "prod-hmac-secret-key-32-chars-minimum"
  SESSION_SECRET: "prod-session-secret-key-32-chars-minimum"
  METRICS_AUTH_TOKEN: "prod-metrics-auth-token-32-chars-minimum"
