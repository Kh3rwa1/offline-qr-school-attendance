name: Physical Hardware-in-the-Loop Certification Gate

on:
  workflow_dispatch:
    inputs:
      enforce_live_hardware:
        description: 'Enforce physical reader and fail closed if absent (true/false)'
        required: true
        default: 'false'

permissions:
  contents: read

jobs:
  physical-hardware-gate:
    name: DESFire EV2/EV3 PC/SC Hardware Verification Gate
    runs-on: [self-hosted, physical-hardware]
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js Environment
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Verify PC/SC Smartcard Subsystem Daemon
        run: |
          if command -v systemctl &> /dev/null; then
            systemctl is-active --quiet pcscd || sudo systemctl start pcscd || true
          fi

      - name: Execute Hardware Verification & APDU Benchmarks
        env:
          HARDWARE_RELEASE_GATE: ${{ inputs.enforce_live_hardware == 'true' && '1' || '0' }}
          GITHUB_SHA: ${{ github.sha }}
        run: npx tsx scripts/hardware-runner.ts

      - name: Upload Hardware Certification Reports
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: hardware-certification-reports
          path: |
            output/hardware-certification-report.json
            output/hardware-certification-report.md
          if-no-files-found: ignore
