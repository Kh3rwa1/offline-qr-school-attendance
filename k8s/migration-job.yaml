apiVersion: batch/v1
kind: Job
metadata:
  name: school-attendance-migration
spec:
  backoffLimit: 3
  template:
    metadata:
      name: school-attendance-migration
    spec:
      serviceAccountName: school-attendance-migration-sa
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: offline-qr-school-attendance:v1.0.0
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/migrate.cjs"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
          envFrom:
            - secretRef:
                name: school-attendance-secrets
            - configMapRef:
                name: school-attendance-config
      volumes:
        - name: tmp-volume
          emptyDir: {}
