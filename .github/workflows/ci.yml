name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  static-check-and-unit-tests:
    name: Static Check & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js Environment
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Execute Dependency License Policy Audit
        run: npx tsx scripts/validate-license-policy.ts

      - name: Unit & Integration Tests
        run: npm test

      - name: Build Web Bundle & Worker Service
        run: npm run build

      - name: Generate CycloneDX 1.4 Software Bill of Materials (SBOM)
        run: npx tsx scripts/generate-sbom.ts

      - name: Upload npm SBOM Artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: sbom-cdx-npm
          path: sbom.json
          if-no-files-found: error

  security-scan:
    name: Security & Vulnerability Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run Gitleaks Full History Secret Scan
        uses: gitleaks/gitleaks-action@f586c14365d4643c6aa59d472ae6e984bf47bb34 # v2.3.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Trivy Security Scanner Binary
        run: |
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.deb" -o /tmp/trivy.deb
          echo "cf1e32ec8d4d8823e023096a28cadb14f5b5123ce03f201fb633c5b76aa712dd  /tmp/trivy.deb" | sha256sum --check --status
          sudo dpkg -i /tmp/trivy.deb
          trivy --version

      - name: Run Trivy Filesystem Vulnerability Scan
        run: |
          trivy fs --severity HIGH,CRITICAL --format sarif --output trivy-fs-results.sarif .

      - name: Upload Trivy FS SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-filesystem

      - name: Build Container Image for Security Scanning
        run: docker build -t offline-qr-school-attendance:scan .

      - name: Run Trivy Container Image Scan (Strict Exit Code Enforcement)
        run: |
          trivy image --exit-code 1 --ignore-unfixed --scanners vuln --severity HIGH,CRITICAL --format sarif --output trivy-image-results.sarif offline-qr-school-attendance:scan
          trivy image --ignore-unfixed --scanners vuln --severity HIGH,CRITICAL --format json --output trivy-image-results.json offline-qr-school-attendance:scan

      - name: Upload Security Vulnerability Scan Artifacts
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: trivy-security-reports
          path: |
            trivy-fs-results.sarif
            trivy-image-results.sarif
            trivy-image-results.json
          if-no-files-found: ignore

  postgres-rls-redis-integration:
    name: PostgreSQL RLS & Redis Production Integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: attendance_migration
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: school_attendance
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js Environment
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgres://attendance_migration:ci_password@127.0.0.1:5432/school_attendance
        run: npx tsx src/db/migrate.ts

      - name: Create Database Roles (attendance_app, attendance_auth, attendance_system, attendance_worker) & Privileges
        run: |
          PGPASSWORD=ci_password psql -h 127.0.0.1 -U attendance_migration -d school_attendance -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'attendance_app') THEN CREATE ROLE attendance_app LOGIN PASSWORD 'ci_password'; END IF; IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'attendance_auth') THEN CREATE ROLE attendance_auth LOGIN PASSWORD 'ci_password'; END IF; IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'attendance_system') THEN CREATE ROLE attendance_system LOGIN PASSWORD 'ci_password'; END IF; IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'attendance_worker') THEN CREATE ROLE attendance_worker LOGIN PASSWORD 'ci_password'; END IF; IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'attendance_system_rls') THEN CREATE ROLE attendance_system_rls NOLOGIN; END IF; ALTER ROLE attendance_app WITH PASSWORD 'ci_password'; ALTER ROLE attendance_auth WITH PASSWORD 'ci_password'; ALTER ROLE attendance_system WITH PASSWORD 'ci_password'; ALTER ROLE attendance_worker WITH PASSWORD 'ci_password'; ALTER ROLE attendance_migration WITH PASSWORD 'ci_password'; GRANT attendance_system_rls TO attendance_system, attendance_worker, attendance_migration; GRANT CONNECT ON DATABASE school_attendance TO attendance_app, attendance_auth, attendance_system, attendance_worker; GRANT USAGE ON SCHEMA public TO attendance_app, attendance_auth, attendance_system, attendance_worker; GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO attendance_app, attendance_system, attendance_worker; GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO attendance_app, attendance_system, attendance_worker; GRANT EXECUTE ON FUNCTION public.lookup_auth_user_by_phone(text) TO attendance_auth; GRANT EXECUTE ON FUNCTION public.get_user_school_memberships(uuid) TO attendance_auth; ALTER DEFAULT PRIVILEGES FOR ROLE attendance_migration IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO attendance_app, attendance_system, attendance_worker; ALTER DEFAULT PRIVILEGES FOR ROLE attendance_migration IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO attendance_app, attendance_system, attendance_worker; ALTER DEFAULT PRIVILEGES FOR ROLE attendance_migration IN SCHEMA public GRANT EXECUTE ON FUNCTIONS TO attendance_auth; END \$\$;"

      - name: Run RLS Schema Integration Suite
        env:
          DATABASE_URL: postgres://attendance_app:ci_password@127.0.0.1:5432/school_attendance
          SYSTEM_DATABASE_URL: postgres://attendance_system:ci_password@127.0.0.1:5432/school_attendance
          AUTH_DATABASE_URL: postgres://attendance_auth:ci_password@127.0.0.1:5432/school_attendance
          REDIS_URL: redis://127.0.0.1:6379
          NODE_ENV: test
          SESSION_SECRET: ci-session-secret-01234567890123456789
          METRICS_AUTH_TOKEN: ci-metrics-auth-token-01234567890123456789
          REDIS_KEY_HMAC_SECRET: ci_redis_hmac_secret_32bytes_long
          RFID_HMAC_SECRET: ci_rfid_hmac_secret_key_32bytes_long
          RFID_CARD_MASTER_KEY: ci_rfid_card_master_key_32bytes_long
          KMS_MASTER_KEY: ci_kms_master_key_01234567890123456789
          PRODUCTION_PG_TEST: "1"
          PG_RLS_MIGRATION_DATABASE_URL: postgres://attendance_migration:ci_password@127.0.0.1:5432/school_attendance
          PG_RLS_APPLICATION_DATABASE_URL: postgres://attendance_app:ci_password@127.0.0.1:5432/school_attendance
          PG_RLS_AUTH_DATABASE_URL: postgres://attendance_auth:ci_password@127.0.0.1:5432/school_attendance
          PG_RLS_SYSTEM_DATABASE_URL: postgres://attendance_system:ci_password@127.0.0.1:5432/school_attendance
        run: npm run test:postgres

  backup-and-restore-drill:
    name: Encrypted Backup & Restore RLS Verification Drill
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: attendance_migration
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: school_attendance
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js Environment
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Seed Database for Backup
        env:
          DATABASE_URL: postgres://attendance_migration:ci_password@127.0.0.1:5432/school_attendance
          NODE_ENV: test
          SESSION_SECRET: ci-session-secret-01234567890123456789
          METRICS_AUTH_TOKEN: ci-metrics-auth-token-01234567890123456789
        run: |
          npx tsx src/db/migrate.ts
          npx tsx src/db/seed.ts

      - name: Install PostgreSQL Client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Execute Encrypted Backup & Restore Verification Drill
        env:
          DATABASE_URL: postgres://attendance_migration:ci_password@127.0.0.1:5432/school_attendance
          TARGET_DATABASE_URL: postgres://attendance_migration:ci_password@127.0.0.1:5432/school_attendance
          BACKUP_PASSPHRASE: ci-backup-encrypted-passphrase-1234567890
        run: ./scripts/backupAndRestore.sh

  docker-compose-production-smoke:
    name: Docker Compose Production Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      POSTGRES_DB: school_attendance
      MIGRATION_DB_USER: attendance_migration
      MIGRATION_DB_PASSWORD: ci_password
      APP_DB_USER: attendance_app
      APP_DB_PASSWORD: ci_password
      SYSTEM_DB_USER: attendance_system
      SYSTEM_DB_PASSWORD: ci_password
      AUTH_DB_USER: attendance_auth
      AUTH_DB_PASSWORD: ci_password
      REDIS_KEY_HMAC_SECRET: ci_redis_hmac_secret_01234567890123456789
      METRICS_AUTH_TOKEN: ci_metrics_token_01234567890123456789
      SESSION_SECRET: ci_session_secret_01234567890123456789
      BACKUP_ENCRYPTION_KEY: ci_backup_encryption_key_32bytes_long
      ALLOW_IN_MEMORY_RATE_LIMITER: "true"
      SMS_PROVIDER: console
      ALLOW_FAKE_SMS_IN_PRODUCTION: "true"
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate QR-Only Compose Configuration
        run: |
          docker compose config --quiet
          echo "✅ Compose configuration validated (QR-only profile, no RFID secrets required)."

      - name: Build Docker Compose Images
        run: |
          docker compose build

      - name: Launch Production Container Stack
        run: |
          docker compose up -d
          docker compose ps

      - name: Verify Application HTTP Health via Compose & Caddy
        run: |
          HEALTHY=false
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/v1/health >/dev/null 2>&1 || curl -fsS http://127.0.0.1/api/v1/health >/dev/null 2>&1; then
              echo "App is healthy and reachable via direct port and Caddy reverse proxy!"
              HEALTHY=true
              break
            fi
            echo "Waiting for stack to become healthy... ($i/30)"
            docker compose ps
            sleep 4
          done
          if [ "$HEALTHY" != "true" ]; then
            echo "HTTP Health Check Failed! Printing container logs..."
            docker compose ps -a
            docker compose logs --no-color
            exit 1
          fi

      - name: Teardown Docker Compose Stack
        if: always()
        run: |
          docker compose logs --tail 200 > compose-failure.log || true
          docker compose down -v || true

  installer-matrix-test:
    name: Clean Appliance Lifecycle Matrix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Make Scripts Executable
        run: chmod +x scripts/install.sh bin/attendease scripts/generate-secrets.sh scripts/verify-restore.sh

      - name: Execute Installer Pre-Flight Dry-Run
        run: |
          ./scripts/install.sh --dry-run
          ./bin/attendease --help

      - name: Verify Restrictive File Permissions (0600 .env)
        run: |
          test "$(stat -c "%a" .env)" = "600" || test "$(stat -c "%a" .env)" = "700"

      - name: Execute Full Unattended Production Installation
        run: |
          ./scripts/install.sh -y

      - name: Verify Appliance Health via Port 80 (Caddy) & Port 3000 (Direct)
        run: |
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:3000/readyz >/dev/null 2>&1 && curl -fsS http://127.0.0.1/readyz >/dev/null 2>&1; then
              echo "App and Caddy are ready and passing probes!"
              break
            fi
            echo "Waiting for ports 3000 and 80 to become ready... ($i/20)"
            sleep 2
          done
          ./bin/attendease status

      - name: Execute Encrypted Snapshot Backup
        run: |
          ./bin/attendease backup
          test -n "$(ls -1 ./backups/*.sql.gz.enc)"

      - name: Simulate Host Daemon Restart & Self-Healing Repair
        run: |
          docker compose down
          ./bin/attendease repair
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:3000/readyz >/dev/null 2>&1 && curl -fsS http://127.0.0.1/readyz >/dev/null 2>&1; then
              echo "Repaired stack is ready!"
              break
            fi
            sleep 2
          done

      - name: Execute Application Update Cycle
        run: |
          ./bin/attendease update
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:3000/readyz >/dev/null 2>&1 && curl -fsS http://127.0.0.1/readyz >/dev/null 2>&1; then
              echo "Updated stack is ready!"
              break
            fi
            sleep 2
          done

      - name: Execute Application Rollback Cycle
        run: |
          ./bin/attendease rollback
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:3000/readyz >/dev/null 2>&1 && curl -fsS http://127.0.0.1/readyz >/dev/null 2>&1; then
              echo "Rolled back stack is ready!"
              break
            fi
            sleep 2
          done

      - name: Execute Database Restore from Backup Snapshot
        run: |
          LATEST_BACKUP=$(ls -1t ./backups/*.sql.gz.enc | head -n 1)
          ./bin/attendease restore "${LATEST_BACKUP}" -y
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:3000/readyz >/dev/null 2>&1 && curl -fsS http://127.0.0.1/readyz >/dev/null 2>&1; then
              echo "Restored stack is ready!"
              break
            fi
            sleep 2
          done

      - name: Clean Uninstallation & Purge
        if: always()
        run: |
          ./bin/attendease uninstall -y --purge || true

  pr-load-smoke-gate:
    name: Mandatory Pull-Request Load Smoke Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: attendance_migration
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: school_attendance
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js Environment
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Execute Authentic Pull-Request Business Load Smoke Gate
        env:
          DATABASE_URL: postgres://attendance_migration:ci_password@127.0.0.1:5432/school_attendance
          AUTH_DATABASE_URL: postgres://attendance_migration:ci_password@127.0.0.1:5432/school_attendance
          REDIS_URL: redis://127.0.0.1:6379
          NODE_ENV: production
          SESSION_SECRET: ci-session-secret-01234567890123456789
          CSRF_SECRET: ci-session-secret-01234567890123456789
          METRICS_AUTH_TOKEN: ci-metrics-auth-token-01234567890123456789
          RFID_HMAC_SECRET: ci_rfid_hmac_secret_key_32bytes_long
          RFID_CARD_MASTER_KEY: ci_rfid_card_master_key_32bytes_long
          KMS_MASTER_KEY: ci_kms_master_key_01234567890123456789
          REDIS_KEY_HMAC_SECRET: ci_redis_hmac_secret_32bytes_long
          ALLOW_IN_MEMORY_RATE_LIMITER: "true"
          SMS_PROVIDER: console
          ALLOW_FAKE_SMS_IN_PRODUCTION: "true"
          LOAD_P95_THRESHOLD_MS: "400"
          LOAD_AUTH_P95_THRESHOLD_MS: "700"
        run: npm run test:load-smoke

      - name: Upload Business Load Benchmark Reports
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: business-load-smoke-reports
          path: output/
          if-no-files-found: ignore

  playwright-e2e:
    name: Playwright Browser E2E (Chromium & Firefox)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: attendance_migration
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: school_attendance
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js Environment
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers (Chromium & Firefox)
        run: npx playwright install --with-deps chromium firefox

      - name: Build Production Bundle & Seed E2E Database
        env:
          DATABASE_URL: postgres://attendance_migration:ci_password@127.0.0.1:5432/school_attendance
          REDIS_URL: redis://127.0.0.1:6379
          NODE_ENV: production
          ALLOW_SEED_RESET: "true"
          SESSION_SECRET: ci-session-secret-01234567890123456789
          CSRF_SECRET: ci-session-secret-01234567890123456789
          METRICS_AUTH_TOKEN: ci-metrics-auth-token-01234567890123456789
          RFID_HMAC_SECRET: ci_rfid_hmac_secret_key_32bytes_long
          RFID_CARD_MASTER_KEY: ci_rfid_card_master_key_32bytes_long
          KMS_MASTER_KEY: ci_kms_master_key_01234567890123456789
          REDIS_KEY_HMAC_SECRET: ci_redis_hmac_secret_32bytes_long
          SMS_PROVIDER: console
          ALLOW_FAKE_SMS_IN_PRODUCTION: "true"
          # Seed step runs as COMPONENT=migrate so validateProductionEnv() is
          # skipped, but migrate.ts imports env.ts which defaults COMPONENT to
          # 'web' unless overridden. Explicitly set to avoid the HMAC check.
          COMPONENT: migrate
        run: |
          npm run build
          npx tsx src/db/migrate.ts
          npx tsx src/db/seed.ts

      - name: "Run Expanded Playwright E2E Suite (retries: 0)"
        env:
          DATABASE_URL: postgres://attendance_migration:ci_password@127.0.0.1:5432/school_attendance
          AUTH_DATABASE_URL: postgres://attendance_migration:ci_password@127.0.0.1:5432/school_attendance
          REDIS_URL: redis://127.0.0.1:6379
          NODE_ENV: production
          SESSION_SECRET: ci-session-secret-01234567890123456789
          CSRF_SECRET: ci-session-secret-01234567890123456789
          METRICS_AUTH_TOKEN: ci-metrics-auth-token-01234567890123456789
          RFID_HMAC_SECRET: ci_rfid_hmac_secret_key_32bytes_long
          RFID_CARD_MASTER_KEY: ci_rfid_card_master_key_32bytes_long
          KMS_MASTER_KEY: ci_kms_master_key_01234567890123456789
          REDIS_KEY_HMAC_SECRET: ci_redis_hmac_secret_32bytes_long
          ALLOW_IN_MEMORY_RATE_LIMITER: "true"
          ALLOW_HTTP_COOKIE: "true"
          DISABLE_RATE_LIMITING: "true"
          SMS_PROVIDER: console
          ALLOW_FAKE_SMS_IN_PRODUCTION: "true"
          PORT: 3100
        run: npm run test:e2e

      - name: Upload Playwright Test Artifacts
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: playwright-report
          path: output/playwright/
          if-no-files-found: ignore

  k8s-manifest-validation:
    name: Kubernetes Schema & Security Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Kubeconform Binary
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.4/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Setup Node.js Environment
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Kubeconform & Strict OpenAPI Schema Validator
        run: npx tsx scripts/validate-k8s-manifests.ts

      - name: Run K8s CRD Validation Unit Test Suite
        run: npx vitest run tests/k8sCrdValidation.test.ts

  k8s-kind-cluster-drill:
    name: Disposable Kind Cluster Deployment & Rollback Drill
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Execute Disposable Kind Cluster Deployment & Rollback Drill
        run: ./scripts/test-k8s-kind.sh

  branch-protection-check:
    name: Branch Protection Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify GitHub Branch Protection Status
        env:
          ADMIN_GITHUB_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUIRE_STRICT_BRANCH_PROTECTION: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && 'true' || 'false' }}
        run: ./scripts/verify-branch-protection.sh

  record-deployment:
    name: Record Continuous Delivery Deployment
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs:
      - static-check-and-unit-tests
      - playwright-e2e
      - postgres-rls-redis-integration
      - backup-and-restore-drill
      - docker-compose-production-smoke
      - k8s-manifest-validation
      - k8s-kind-cluster-drill
      - branch-protection-check
    permissions:
      deployments: write
      contents: read
    steps:
      - name: Create GitHub Deployment & Record Success Status
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const deployment = await github.rest.repos.createDeployment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: context.sha,
                environment: 'production',
                description: 'Continuous Delivery Deployment for main @ ' + context.sha.slice(0, 7),
                auto_merge: false,
                required_contexts: []
              });
              if (deployment.data && deployment.data.id) {
                await github.rest.repos.createDeploymentStatus({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  deployment_id: deployment.data.id,
                  state: 'success',
                  environment: 'production',
                  environment_url: 'https://attendease.app',
                  description: 'Deployment succeeded for ' + context.sha.slice(0, 7)
                });
                console.log('Successfully recorded deployment ' + deployment.data.id + ' for SHA ' + context.sha);
              }
            } catch (err) {
              console.log('Deployment record notice: ' + (err.message || err));
            }
