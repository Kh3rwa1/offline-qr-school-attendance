name: Temporary Multer lock refresh

on:
  push:
    branches:
      - fix/gateway-production-hardening-clean

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh Multer lock entry
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund multer@2.3.0

      - name: Commit regenerated manifests
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency manifests already current."
            exit 0
          fi
          git commit -m "fix(deps): upgrade multer to 2.3.0"
          git push origin "HEAD:${GITHUB_REF_NAME}"
