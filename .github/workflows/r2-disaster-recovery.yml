name: Cloudflare R2 Disaster Recovery Verification Drill

on:
  workflow_dispatch:
    inputs:
      r2_bucket:
        description: 'Target Cloudflare R2 Bucket Name'
        required: false
        default: 'attendease-backups'

permissions:
  contents: read

jobs:
  r2-live-dr-drill:
    name: Cloudflare R2 Live Disaster Recovery Round-Trip Drill
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: attendance_migration
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: school_attendance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U attendance_migration -d school_attendance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js Environment
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Execute Live Cloudflare R2 Disaster Recovery Verification Drill
        env:
          DATABASE_URL: postgres://attendance_migration:ci_password@127.0.0.1:5432/school_attendance
          SYSTEM_DATABASE_URL: postgres://attendance_migration:ci_password@127.0.0.1:5432/school_attendance
          AUTH_DATABASE_URL: postgres://attendance_migration:ci_password@127.0.0.1:5432/school_attendance
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY || 'ci-backup-encryption-passphrase-32chars' }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ github.event.inputs.r2_bucket || 'attendease-backups' }}
          NODE_ENV: test
          ALLOW_IN_MEMORY_RATE_LIMITER: "true"
          ALLOW_FAKE_SMS_IN_PRODUCTION: "true"
          SMS_PROVIDER: console
        run: |
          npx tsx scripts/runR2LiveDrill.ts

      - name: Upload Disaster Recovery Verification Report Artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: r2-live-dr-report
          path: output/r2_live_drill_report.json
          if-no-files-found: error
