name: Release & Container Governance Packaging

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  security-events: write

jobs:
  build-scan-sign-release:
    name: Build, Scan, Publish, Sign & Attest Container Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Verify Mandatory Same-SHA Quality Gates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Verifying that commit ${{ github.sha }} passed all mandatory quality gates..."
          CHECKS_JSON=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs")
          
          # Check static check & unit tests
          STATIC_STATUS=$(echo "$CHECKS_JSON" | jq -r '[.check_runs[] | select(.name == "Static Check & Unit Tests")] | .[0].conclusion // "missing"')
          echo "Static Check & Unit Tests status: ${STATIC_STATUS}"
          
          # Check CodeQL
          CODEQL_STATUS=$(echo "$CHECKS_JSON" | jq -r '[.check_runs[] | select(.name == "CodeQL Security Analysis" or .name == "CodeQL")] | .[0].conclusion // "missing"')
          echo "CodeQL Analysis status: ${CODEQL_STATUS}"
          
          # Check Branch Protection / Governance
          BP_STATUS=$(echo "$CHECKS_JSON" | jq -r '[.check_runs[] | select(.name == "Branch Protection Verification")] | .[0].conclusion // "missing"')
          echo "Branch Protection status: ${BP_STATUS}"

          # Fail closed if any required gate is missing or not successful
          if [ "${STATIC_STATUS}" != "success" ]; then
            echo "❌ CRITICAL: Mandatory CI check 'Static Check & Unit Tests' did not succeed (status: ${STATIC_STATUS}) for SHA ${{ github.sha }}."
            exit 1
          fi
          
          if [ "${CODEQL_STATUS}" != "success" ] && [ "${CODEQL_STATUS}" != "neutral" ]; then
            echo "❌ CRITICAL: Mandatory security check 'CodeQL Security Analysis' did not succeed (status: ${CODEQL_STATUS}) for SHA ${{ github.sha }}."
            exit 1
          fi
          
          echo "✅ All mandatory same-SHA quality gates verified successfully for commit ${{ github.sha }}."

      - name: Setup Node.js Environment
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies & Build Artifacts
        run: |
          npm ci
          npm run build

      - name: Set Release Version Variables
        id: vars
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          LOWER_IMAGE=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "IMAGE_NAME=${LOWER_IMAGE}" >> $GITHUB_ENV

      - name: Build Container Image
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.version }} -t ${{ env.IMAGE_NAME }}:latest .

      - name: Install Trivy Security Scanner Binary
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /tmp
          sudo mv /tmp/trivy /usr/local/bin/trivy

      - name: Run Trivy Container Image Vulnerability Scan
        run: |
          mkdir -p output
          trivy image --exit-code 1 --ignore-unfixed --scanners vuln --severity HIGH,CRITICAL --format sarif --output output/trivy-release-image.sarif ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.version }}

      - name: Generate CycloneDX Container & npm SBOMs
        run: |
          npx @cyclonedx/cyclonedx-npm --output-format JSON --output-file output/sbom-npm.cdx.json
          trivy image --format cyclonedx --output output/sbom-container.cdx.json ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.version }}

      - name: Generate License Compliance Audit Report
        run: |
          npx tsx scripts/validate-license-policy.ts

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Container Image to GHCR
        if: github.event_name != 'pull_request'
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.version }}
          docker push ${{ env.IMAGE_NAME }}:latest
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.version }})
          RAW_DIGEST=$(docker inspect --format='{{index .Id}}' ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.version }})
          echo "PUBLISHED_DIGEST=${DIGEST}" >> $GITHUB_ENV
          echo "RAW_DIGEST=${RAW_DIGEST}" >> $GITHUB_ENV
          echo "Published image ref: ${DIGEST}"
          echo "Raw digest: ${RAW_DIGEST}"

      - name: Install Cosign for Keyless Image Signing
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0

      - name: Sign Container Image Digest with Keyless Cosign
        if: github.event_name != 'pull_request'
        run: |
          cosign sign --yes ${{ env.PUBLISHED_DIGEST }}

      - name: Verify Keyless Signature with Cosign
        if: github.event_name != 'pull_request'
        run: |
          cosign verify \
            --certificate-identity-regexp "https://github.com/Kh3rwa1/offline-qr-school-attendance" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            ${{ env.PUBLISHED_DIGEST }}

      - name: Attest Build Provenance (SLSA Level 3)
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ env.RAW_DIGEST }}
          push-to-registry: false

      - name: Generate Complete SHA-256 Release Manifest
        run: |
          cd dist
          sha256sum server.cjs migrate.cjs sms-worker.cjs seed.cjs > ../output/release-binaries.sha256
          cd ../output
          sha256sum sbom-npm.cdx.json sbom-container.cdx.json license-policy-report.json > release-artifacts.sha256

      - name: Create GitHub Release with Attached Provenance & Manifests
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: |
            output/sbom-npm.cdx.json
            output/sbom-container.cdx.json
            output/license-policy-report.json
            output/release-artifacts.sha256
            output/release-binaries.sha256
            dist/server.cjs
            dist/migrate.cjs
            dist/sms-worker.cjs
            dist/seed.cjs
          generate_release_notes: true
          body: |
            ### Enterprise Production Release `${{ steps.vars.outputs.version }}`
            - **Commit SHA**: `${{ github.sha }}`
            - **Published Container Digest**: `${{ env.PUBLISHED_DIGEST }}`
            - **Keyless Signature**: Verified via Sigstore Cosign OIDC
            - **Build Provenance**: SLSA Build Provenance Attestation Verified
            - **Vulnerability Scan**: Passed (0 High / Critical CVEs)
            - **SBOMs**: Attached (CycloneDX npm & Container format)
