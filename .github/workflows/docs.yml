name: Documentation Integrity & Freshness

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'docs/**'
  schedule:
    - cron: '0 3 * * 1'

jobs:
  docs:
    name: Docs verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/verify-product-claims.ts
      - if: github.event_name == 'schedule'
        run: npx tsx scripts/check-docs-freshness.ts
