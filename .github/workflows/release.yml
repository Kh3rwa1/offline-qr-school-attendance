name: Release & Container Governance Packaging

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write
  security-events: write

jobs:
  build-scan-sign-release:
    name: Build, Scan, Publish, Sign & Attest Container Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies & Build Artifacts
        run: |
          npm ci
          npm run build

      - name: Set Release Version Variables
        id: vars
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "IMAGE_NAME=ghcr.io/${{ github.repository }}" >> $GITHUB_ENV

      - name: Build Container Image
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.version }} -t ${{ env.IMAGE_NAME }}:latest .

      - name: Install Trivy Security Scanner Binary
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /tmp
          sudo mv /tmp/trivy /usr/local/bin/trivy

      - name: Run Trivy Container Image Scan (Strict Exit Code Enforcement)
        run: |
          trivy image --exit-code 1 --severity HIGH,CRITICAL --format sarif --output trivy-release-image.sarif ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.version }}

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Container Image to GHCR
        if: github.event_name != 'pull_request'
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.version }}
          docker push ${{ env.IMAGE_NAME }}:latest
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.version }})
          echo "PUBLISHED_DIGEST=${DIGEST}" >> $GITHUB_ENV
          echo "Published digest: ${DIGEST}"

      - name: Install Cosign for Keyless Image Signing
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bec826aa1317710dab1929c7 # v3.7.0

      - name: Sign Container Image Digest with Cosign
        if: github.event_name != 'pull_request'
        run: |
          cosign sign --yes ${{ env.PUBLISHED_DIGEST }}

      - name: Generate CycloneDX npm & Container SBOMs
        run: |
          mkdir -p output
          npx @cyclonedx/cyclonedx-npm --output-format JSON --output-file output/sbom-npm.cdx.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c92800b6147e7c4f420e6f6630f589c314a3a60a # v2.2.1
        with:
          files: |
            output/sbom-npm.cdx.json
            dist/server.cjs
            dist/migrate.cjs
            dist/sms-worker.cjs
          generate_release_notes: true
          body: |
            ### Production Release `${{ steps.vars.outputs.version }}`
            - **Published Container Digest**: `${{ env.PUBLISHED_DIGEST }}`
            - **Signed with Cosign**: Yes (Keyless OIDC)
            - **Trivy Vulnerability Scan**: Passed (0 High/Critical)
