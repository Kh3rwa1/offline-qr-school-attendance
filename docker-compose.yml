services:
  db:
    image: postgres:16-alpine
    container_name: school_attendance_db
    restart: always
    command: ["postgres", "-c", "wal_level=replica"]
    environment:
      POSTGRES_USER: ${MIGRATION_DB_USER:?MIGRATION_DB_USER is required}
      POSTGRES_PASSWORD: ${MIGRATION_DB_PASSWORD:?MIGRATION_DB_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${MIGRATION_DB_USER:?MIGRATION_DB_USER is required}']
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    container_name: school_attendance_redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  app:
    image: ${ATTENDEASE_IMAGE:-ghcr.io/kh3rwa1/offline-qr-school-attendance:v1.3.0}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: school_attendance_app
    restart: always
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      COMPONENT: web
      PORT: 3000
      DATABASE_URL: postgres://${APP_DB_USER:?APP_DB_USER is required}:${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}@db:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      SYSTEM_DATABASE_URL: postgres://${SYSTEM_DB_USER:?SYSTEM_DB_USER is required}:${SYSTEM_DB_PASSWORD:?SYSTEM_DB_PASSWORD is required}@db:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      AUTH_DATABASE_URL: postgres://${AUTH_DB_USER:?AUTH_DB_USER is required}:${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD is required}@db:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      REDIS_URL: redis://redis:6379
      REDIS_KEY_HMAC_SECRET: ${REDIS_KEY_HMAC_SECRET:?REDIS_KEY_HMAC_SECRET is required}
      METRICS_AUTH_TOKEN: ${METRICS_AUTH_TOKEN:?METRICS_AUTH_TOKEN is required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      CSRF_SECRET: ${CSRF_SECRET:-${SESSION_SECRET}}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:?BACKUP_ENCRYPTION_KEY is required}
      SMS_PROVIDER: ${SMS_PROVIDER:?SMS_PROVIDER is required}
      ALLOW_FAKE_SMS_IN_PRODUCTION: ${ALLOW_FAKE_SMS_IN_PRODUCTION:-false}
      ALLOW_IN_MEMORY_RATE_LIMITER: ${ALLOW_IN_MEMORY_RATE_LIMITER:-false}
      RFID_HMAC_SECRET: ${RFID_HMAC_SECRET:-}
      RFID_CARD_MASTER_KEY: ${RFID_CARD_MASTER_KEY:-}
      KMS_MASTER_KEY: ${KMS_MASTER_KEY:-}
    volumes:
      - ./backups:/backups:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3000/api/v1/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      bootstrap-db:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

  bootstrap-db:
    image: postgres:16-alpine
    container_name: school_attendance_bootstrap
    environment:
      DB_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      MIGRATION_DB_USER: ${MIGRATION_DB_USER:?MIGRATION_DB_USER is required}
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD:?MIGRATION_DB_PASSWORD is required}
      APP_DB_USER: ${APP_DB_USER:?APP_DB_USER is required}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}
      SYSTEM_DB_USER: ${SYSTEM_DB_USER:?SYSTEM_DB_USER is required}
      SYSTEM_DB_PASSWORD: ${SYSTEM_DB_PASSWORD:?SYSTEM_DB_PASSWORD is required}
      AUTH_DB_USER: ${AUTH_DB_USER:?AUTH_DB_USER is required}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD is required}
    volumes:
      - ./docker/bootstrap-db.sh:/bootstrap-db.sh:ro
    entrypoint: ['/bin/sh', '/bootstrap-db.sh']
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    depends_on:
      db:
        condition: service_healthy

  migrate:
    image: ${ATTENDEASE_IMAGE:-ghcr.io/kh3rwa1/offline-qr-school-attendance:v1.3.0}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: school_attendance_migrate
    environment:
      NODE_ENV: production
      COMPONENT: migrate
      DATABASE_URL: postgres://${MIGRATION_DB_USER:?MIGRATION_DB_USER is required}:${MIGRATION_DB_PASSWORD:?MIGRATION_DB_PASSWORD is required}@db:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      REDIS_URL: redis://redis:6379
      REDIS_KEY_HMAC_SECRET: ${REDIS_KEY_HMAC_SECRET:?REDIS_KEY_HMAC_SECRET is required}
      METRICS_AUTH_TOKEN: ${METRICS_AUTH_TOKEN:?METRICS_AUTH_TOKEN is required}
    command: ['node', 'dist/migrate.cjs']
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      bootstrap-db:
        condition: service_completed_successfully

  sms-worker:
    image: ${ATTENDEASE_IMAGE:-ghcr.io/kh3rwa1/offline-qr-school-attendance:v1.3.0}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: school_attendance_sms_worker
    restart: always
    environment:
      NODE_ENV: production
      COMPONENT: worker
      DATABASE_URL: postgres://${APP_DB_USER:?APP_DB_USER is required}:${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}@db:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      SYSTEM_DATABASE_URL: postgres://${SYSTEM_DB_USER:?SYSTEM_DB_USER is required}:${SYSTEM_DB_PASSWORD:?SYSTEM_DB_PASSWORD is required}@db:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      REDIS_URL: redis://redis:6379
      REDIS_KEY_HMAC_SECRET: ${REDIS_KEY_HMAC_SECRET:?REDIS_KEY_HMAC_SECRET is required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      SMS_PROVIDER: ${SMS_PROVIDER:?SMS_PROVIDER is required}
      ALLOW_FAKE_SMS_IN_PRODUCTION: ${ALLOW_FAKE_SMS_IN_PRODUCTION:-false}
    command: ['node', 'dist/sms-worker.cjs']
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "const fs=require('fs'); const m=fs.statSync('/tmp/worker-heartbeat').mtimeMs; if(Date.now()-m > 60000) process.exit(1);"
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  backup:
    image: postgres:16-alpine
    container_name: school_attendance_backup
    restart: always
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${MIGRATION_DB_USER:?MIGRATION_DB_USER is required}
      POSTGRES_PASSWORD: ${MIGRATION_DB_PASSWORD:?MIGRATION_DB_PASSWORD is required}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:?BACKUP_ENCRYPTION_KEY is required}
      BACKUP_CRON: ${BACKUP_CRON:-18:30}
      BACKUP_RETAIN_DAYS: ${BACKUP_RETAIN_DAYS:-14}
      # --- Off-site encrypted replication (Cloudflare R2 / S3 / B2 / MinIO) ---
      # Leave blank to keep backups local only. When configured, every nightly
      # snapshot is replicated off the appliance and verified remotely.
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      OFFSITE_BACKUP_REGION: ${OFFSITE_BACKUP_REGION:-auto}
      OFFSITE_BACKUP_PREFIX: ${OFFSITE_BACKUP_PREFIX:-attendease}
      OFFSITE_BACKUP_MAX_ATTEMPTS: ${OFFSITE_BACKUP_MAX_ATTEMPTS:-3}
      OFFSITE_BACKUP_TIMEOUT: ${OFFSITE_BACKUP_TIMEOUT:-1800}
      OFFSITE_MAX_AGE_HOURS: ${OFFSITE_MAX_AGE_HOURS:-48}
      OFFSITE_BACKUP_CMD: '${OFFSITE_BACKUP_CMD:-/bin/sh /offsite-upload.sh "$$BACKUP_FILE"}'
    volumes:
      - ./backups:/backups
      - ./docker/backup-entrypoint.sh:/backup-entrypoint.sh:ro
      - ./docker/offsite-upload.sh:/offsite-upload.sh:ro
      - ./docker/backup-healthcheck.sh:/backup-healthcheck.sh:ro
    entrypoint: ['/bin/sh', '/backup-entrypoint.sh']
    healthcheck:
      test: ['CMD-SHELL', '/bin/sh /backup-healthcheck.sh']
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    container_name: school_attendance_caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      SERVER_DOMAIN: ${SERVER_DOMAIN:-localhost}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    depends_on:
      app:
        condition: service_healthy

  rfid-gateway:
    profiles: ["rfid"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: school_attendance_rfid_gateway
    command: ['node', 'dist/server.cjs']
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgres://${APP_DB_USER:?APP_DB_USER is required}:${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}@db:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      SYSTEM_DATABASE_URL: postgres://${SYSTEM_DB_USER:?SYSTEM_DB_USER is required}:${SYSTEM_DB_PASSWORD:?SYSTEM_DB_PASSWORD is required}@db:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      AUTH_DATABASE_URL: postgres://${AUTH_DB_USER:?AUTH_DB_USER is required}:${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD is required}@db:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      REDIS_URL: redis://redis:6379
      REDIS_KEY_HMAC_SECRET: ${REDIS_KEY_HMAC_SECRET:?REDIS_KEY_HMAC_SECRET is required}
      METRICS_AUTH_TOKEN: ${METRICS_AUTH_TOKEN:?METRICS_AUTH_TOKEN is required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      RFID_HMAC_SECRET: ${RFID_HMAC_SECRET:-}
      RFID_CARD_MASTER_KEY: ${RFID_CARD_MASTER_KEY:-}
      KMS_MASTER_KEY: ${KMS_MASTER_KEY:-}
      ALLOW_LEGACY_RFID_UID_MODE: ${ALLOW_LEGACY_RFID_UID_MODE:-false}
    ports:
      - '3001:3001'
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # ==========================================================================
  # Monitoring & Alert Delivery (opt-in profile)
  # ==========================================================================
  # Start with:  docker compose --profile monitoring up -d
  #
  # Without these two services the alert rules in ./monitoring are never
  # evaluated and nobody is notified when something breaks. Both bind to
  # 127.0.0.1 only - never expose them to the school LAN or the internet.
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.53.0
    container_name: school_attendance_prometheus
    restart: always
    environment:
      METRICS_AUTH_TOKEN: ${METRICS_AUTH_TOKEN:?METRICS_AUTH_TOKEN is required}
      FEATURE_RFID: ${FEATURE_RFID:-false}
      PROMETHEUS_RETENTION: ${PROMETHEUS_RETENTION:-15d}
      PROMETHEUS_SCRAPE_INTERVAL: ${PROMETHEUS_SCRAPE_INTERVAL:-30s}
      DEPLOYMENT_ID: ${DEPLOYMENT_ID:-attendease-appliance}
    volumes:
      - ./monitoring:/etc/prometheus/rules:ro
      - ./docker/prometheus-entrypoint.sh:/prometheus-entrypoint.sh:ro
      - prometheus_data:/prometheus
    entrypoint: ['/bin/sh', '/prometheus-entrypoint.sh']
    ports:
      - '127.0.0.1:9090:9090'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:9090/-/healthy || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    depends_on:
      app:
        condition: service_healthy

  alertmanager:
    profiles: ["monitoring"]
    image: prom/alertmanager:v0.27.0
    container_name: school_attendance_alertmanager
    restart: always
    environment:
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-attendease@localhost}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-true}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      WATCHDOG_WEBHOOK_URL: ${WATCHDOG_WEBHOOK_URL:-}
      ALERT_REPEAT_INTERVAL: ${ALERT_REPEAT_INTERVAL:-6h}
      ALERT_CRITICAL_REPEAT_INTERVAL: ${ALERT_CRITICAL_REPEAT_INTERVAL:-1h}
    volumes:
      - ./docker/alertmanager-entrypoint.sh:/alertmanager-entrypoint.sh:ro
      - alertmanager_data:/alertmanager
    entrypoint: ['/bin/sh', '/alertmanager-entrypoint.sh']
    ports:
      - '127.0.0.1:9093:9093'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:9093/-/healthy || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
  prometheus_data:
  alertmanager_data:
